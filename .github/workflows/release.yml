name: Build & Release (macOS, Windows, Linux)

on:
  push:
    branches:
      - "claude/elegant-rubin-6px0x5"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.0)"
        required: false
        default: "1.0.0"

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          swift --version
          sw_vers

      - name: Resolve version
        id: ver
        run: |
          V="${{ github.event.inputs.version }}"
          if [ -z "$V" ]; then V="1.0.0"; fi
          echo "version=${V}" >> "$GITHUB_OUTPUT"
          echo "build=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "tag=v${V}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build and package app
        run: |
          chmod +x packaging/build_app.sh
          ./packaging/build_app.sh "${{ steps.ver.outputs.version }}" "${{ steps.ver.outputs.build }}"

      - name: Publish GitHub Release (macOS assets)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Ecto Remote ${{ steps.ver.outputs.tag }}
          body_path: packaging/RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            EctoRemote-macOS-*.zip
            EctoRemote-macOS-*.dmg

  build-windows:
    needs: build-macos
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: electron
        run: npm install

      - name: Build Windows app
        working-directory: electron
        run: npx electron-builder --win --publish never

      - name: Publish GitHub Release (Windows asset)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version || '1.0.0' }}.${{ github.run_number }}
          name: Ecto Remote v${{ github.event.inputs.version || '1.0.0' }}.${{ github.run_number }}
          draft: false
          prerelease: false
          files: |
            electron/dist/*.exe

  build-linux:
    needs: build-macos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: electron
        run: npm install

      - name: Build Linux app
        working-directory: electron
        run: npx electron-builder --linux --publish never

      - name: Publish GitHub Release (Linux assets)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version || '1.0.0' }}.${{ github.run_number }}
          name: Ecto Remote v${{ github.event.inputs.version || '1.0.0' }}.${{ github.run_number }}
          draft: false
          prerelease: false
          files: |
            electron/dist/*.AppImage
            electron/dist/*.deb
